[package]
name = "deskspace-app"
description = "DeskSpace desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "deskspace"
path = "src/main.rs"

[[bin]]
name = "deskspace-watchdog"
path = "src/watchdog_main.rs"

[dependencies]
deskspace-core.workspace = true
deskspace-config.workspace = true
deskspace-platform.workspace = true
deskspace-update.workspace = true
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
winresource = "0.1.31"

# Windows installer and uninstaller, built by the CI-only `cargo-packager`
# tool (ROADMAP D6). Run from the repository root:
#   cargo build --release -p deskspace-app
#   cargo packager -p deskspace-app --release --formats nsis
# `binaries` is explicit because the package has two bin targets and neither
# is named `deskspace-app`, so auto-detection would mark both as non-main.
# cargo-packager changes into this package's directory before packaging, so
# `resources`, `template`, and `installerIcon` are relative to it.
[package.metadata.packager]
productName = "DeskSpace"
identifier = "com.generalchad.despacespace"
publisher = "Timothy W. Brown"
description = "A free and open-source desktop space organizer for Windows"
homepage = "https://github.com/generalchad/DeskSpace"
formats = ["nsis"]
binaries = [
    { path = "deskspace", main = true },
    { path = "deskspace-watchdog" },
]
resources = ["../../LICENSE", "../../NOTICE", "../../README.md"]

[package.metadata.packager.nsis]
installMode = "currentUser"
installerIcon = "../../assets/deskspace.ico"
template = "../../packaging/nsis/installer.nsi"

[lints]
workspace = true
