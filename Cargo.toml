[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Timothy W. Brown"]
repository = "https://github.com/generalchad/DeskSpace"
homepage = "https://github.com/generalchad/DeskSpace"
description = "A free and open-source desktop space organizer for Windows"

[workspace.dependencies]
deskspace-core = { path = "crates/deskspace-core" }
deskspace-config = { path = "crates/deskspace-config" }
deskspace-platform = { path = "crates/deskspace-platform" }
deskspace-update = { path = "crates/deskspace-update" }

serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
windows = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
