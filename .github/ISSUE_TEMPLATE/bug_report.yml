name: Bug report
description: Something in DeskSpace does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the existing issues first.
        Security problems go through a [private report](https://github.com/generalchad/DeskSpace/security/advisories/new) instead.
        Do not paste personal file names or paths you would rather keep private; describe them instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help for anything visual.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Right-click a space and choose ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DeskSpace version
      description: Settings > About shows it.
      placeholder: "0.2.3"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install DeskSpace?
      options:
        - Installer (setup.exe)
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: "Windows 11 24H2 (build 26100)"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup details
      description: Anything that might matter, such as the desktop takeover being on, multiple monitors, display scaling, or other desktop tools (Fences, Wallpaper Engine, ...).
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Optional. When built from source, `cargo run -p deskspace-app -- -vv` prints a detailed log; paste the part around the problem.
      render: text
