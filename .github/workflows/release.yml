name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Show Rust version
        run: rustc -Vv
      - name: Check tag matches workspace version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'deskspace-app' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match workspace version $version"
          }
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=C:\Users\runneradmin\.cargo=cargo
        run: cargo build --release --locked -p deskspace-app
      # The installer is unsigned until SignPath is wired in (TASKS R10).
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build installer
        shell: pwsh
        run: |
          cargo packager -p deskspace-app --release --formats nsis
          $setup = Get-ChildItem target/release/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "cargo-packager produced no NSIS setup.exe" }
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV
      # Signs the installer with the minisign key and writes the update feed
      # (`latest.json`) the in-app updater reads. Skipped until the
      # DESKSPACE_MINISIGN_KEY secret exists, so releases still work without it.
      # The public half goes in `crates/deskspace-update/src/lib.rs`
      # (`UPDATE_PUBKEY`), base64-encoded like the secret.
      - name: Sign installer and build the update feed
        if: ${{ secrets.DESKSPACE_MINISIGN_KEY != '' }}
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.DESKSPACE_MINISIGN_KEY }}
        shell: pwsh
        run: |
          cargo packager signer sign "$env:SETUP"
          $signature = (Get-Content "$env:SETUP.sig" -Raw).Trim()
          $name = Split-Path $env:SETUP -Leaf
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$name"
          $feed = [ordered]@{
            version   = $env:GITHUB_REF_NAME
            notes     = "See the release notes on the release page."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
                format    = "nsis"
              }
            }
          }
          $feed | ConvertTo-Json -Depth 6 | Out-File -Encoding utf8 update.json
          "FEED=update.json" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        run: |
          $name = "deskspace-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/deskspace.exe, target/release/deskspace-watchdog.exe, LICENSE, NOTICE, README.md -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name" >> $env:GITHUB_ENV
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A forced tag update re-runs this workflow. Replace any release that
          # already exists for the tag so the publish is idempotent; the assets
          # are rebuilt by the steps above.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete $env:GITHUB_REF_NAME --yes 2>$null
          $extra = @()
          if ($env:GITHUB_REF_NAME -match '-') { $extra += '--prerelease' }
          $assets = @("$env:ASSET.zip", "$env:ASSET.zip.sha256", "$env:SETUP")
          if ($env:FEED) { $assets += $env:FEED }
          gh release create $env:GITHUB_REF_NAME @assets `
            --title "DeskSpace $env:GITHUB_REF_NAME" --generate-notes @extra
